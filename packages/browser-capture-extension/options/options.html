<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Verity One Capture Options</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <main class="options">
      <h1>Verity One Capture</h1>
      <label>
        Local VO URL
        <input id="localVoUrl" type="url" autocomplete="off" spellcheck="false">
      </label>
      <label>
        Capture token
        <input id="token" type="password" autocomplete="off" spellcheck="false">
      </label>
      <button id="save" type="button">Save</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
